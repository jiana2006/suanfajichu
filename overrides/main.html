{% block scripts %}
  {{ super() }}
  <!-- 不倒翁的容器 -->
  <div class="sakana-box"></div>

  <!-- 初始化脚本 -->
  <script>
    window.addEventListener('load', () => {
      // 检查 Sakana 对象是否已经加载成功
      if (typeof Sakana !== 'undefined') {
        Sakana.init({
          el: '.sakana-box',      // 绑定到上面的容器
          scale: 0.5,             // 缩放比例（0.5 代表原尺寸一半）
          canSwitchCharacter: true, // 允许点击切换角色
        });
      } else {
        console.error('Sakana 脚本加载失败，请检查 CDN 网络！');
      }
    });
  </script>
{% endblock %}
