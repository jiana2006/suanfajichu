site_name: 我的学习Wiki
site_description: 个人学习知识库

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - 首页: index.md
  - 课程笔记:
      - C语言: c.md
      - Python: python.md
  - 学习路线: route.md
  - FAQ: faq.md

plugins:
  - search

markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences