site_name: 喵喵基础算法
site_description: 个人学习知识库
site_author: 喵喵

theme:
  name: material
  language: zh
  features:
    # 导航
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    # 搜索
    - search.suggest
    - search.highlight
    # 代码块
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal         # 这里修改颜色
      accent: teal          # 这里修改颜色
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal         # 深色模式也同步修改
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
nav:
  - 首页: index.md

  - 基础算法:
    - 编程语言:
      - Python: python.md
      - C语言: c.md
      - C++: cpp.md
      - Java: java.md
    - 数学技巧:
      - 经典数学题: math-problem.md
      - 简化计算: simplify-computation.md
      - 数学公式: math-formula.md
    - 算法:
      - 字符串: string.md
      - 排序: sort.md
      - 枚举: enum.md
      - 二分查找: binary-search.md
      - 时间复杂度: Time Complexity.md
      - 高精度算法: high-precision.md
      - 动态规划: Dynamic Programming.md
      - 广度优先搜索: Breadth-First Search.md
      - 深度优先搜索: Depth-First Search.md
      - 贪心算法: Greedy Algorithm.md
      - STL容器: standard template library.md
      - 前缀和与差分: prefix-sum.md
      - 树状数组: fenwick-tree.md
      - 回溯: backtracking.md
      - 字典树: trie-tree.md
      - 线段树: segment-tree.md
      - 滑动窗口: sliding-window.md
      - 哈希查找: hash-lookup.md
      - 哈希表: hash-table.md

  - 数据结构:
    - 线性表: linear-list.md
    - 二叉树: binary-tree.md
    - 栈: stack.md
    - 队列: queue.md
    - 堆: heap.md
    - 集合: set.md
    - 图的基本应用: graph.md

  - 个人学习分享: route.md

  - 路线:
    - 前端: frontend.md
    - 后端: backend.md
    - 考研: exam.md
    - 考公: exam-public.md
    - 测试: test.md
    - AI: ai.md
    - 算法: algorithm.md
    - 嵌入式: embedded.md
    - 网安: network.md
    - 其他: other.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js